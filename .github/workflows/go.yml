name: Release Build

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  test:
    name: "测试"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

  build:
    name: "发布构建应用"
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: go.sum

      - name: Build for Windows amd64
        run: GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -trimpath -v -o dist/school_sdk_go-windows-amd64-${{ github.ref_name }}.exe .

      - name: Build for Windows i386
        run: GOOS=windows GOARCH=386 go build -ldflags="-s -w" -trimpath -v -o dist/school_sdk_go-windows-i386-${{ github.ref_name }}.exe .

      - name: Build for Linux
        run: GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -trimpath -v -o dist/school_sdk_go-linux-amd64-${{ github.ref_name }} .

      - name: Build for macOS (Intel)
        run: GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -trimpath -v -o dist/school_sdk_go-darwin-amd64-${{ github.ref_name }} .

      - name: Build for macOS (Apple Silicon)
        run: GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -trimpath -v -o dist/school_sdk_go-darwin-arm64-${{ github.ref_name }} .

      - name: Generate release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          sed -i '/./,$!d' release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > release-notes.md
          fi
          cat release-notes.md

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
